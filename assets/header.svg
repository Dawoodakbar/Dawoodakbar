<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Dawood Akbar, iOS Developer in Lahore">
<title>Dawood Akbar, iOS Developer in Lahore</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#131c38"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
<clipPath id="round"><rect width="1200" height="340" rx="22"/></clipPath>

<linearGradient id="name" gradientUnits="userSpaceOnUse" x1="-700" y1="0" x2="-100" y2="0">
  <stop offset="0" stop-color="#f1f4fd"/><stop offset="0.45" stop-color="#9cc4ff"/><stop offset="0.55" stop-color="#c9f2e2"/><stop offset="1" stop-color="#f1f4fd"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;0.6;1" dur="7s" repeatCount="indefinite"/>
</linearGradient>
<radialGradient id="orb" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#5b9dff" stop-opacity="0.5"/><stop offset="1" stop-color="#5b9dff" stop-opacity="0"/></radialGradient>
<radialGradient id="orb2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#34d399" stop-opacity="0.28"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
<clipPath id="screen"><rect x="934" y="52" width="192" height="320" rx="30"/></clipPath>

</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }

.float { animation: float 9s ease-in-out infinite; }
.float2 { animation: float 11s ease-in-out infinite reverse; }
@keyframes float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-26px,18px); } }
.phone { animation: rise 6s ease-in-out infinite; }
@keyframes rise { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.banner { animation: banner 7s cubic-bezier(.2,.8,.2,1) infinite; }
@keyframes banner { 0%,58% { transform: translateY(0); } 66%,90% { transform: translateY(-96px); } 100% { transform: translateY(0); } }
.ecg { stroke-dasharray: 420; animation: ecg 2.4s linear infinite; }
@keyframes ecg { from { stroke-dashoffset: 840; } to { stroke-dashoffset: 0; } }
.skel { animation: skel 1.8s ease-in-out infinite; }
.skel.b { animation-delay: .3s; } .skel.c { animation-delay: .6s; }
@keyframes skel { 0%,100% { fill-opacity: .07; } 50% { fill-opacity: .16; } }
.blink { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { fill-opacity: 0; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#round)">
<rect width="1200" height="340" fill="url(#bg)"/>
<rect width="1200" height="340" fill="url(#grid)"/>

<circle class="float" cx="1010" cy="170" r="300" fill="url(#orb)"/>
<circle class="float2" cx="760" cy="330" r="220" fill="url(#orb2)"/>
<text x="64" y="94" class="mono" font-size="14" letter-spacing="3" fill="#86b4ff">iOS DEVELOPER  ·  LAHORE, PAKISTAN</text>
<text x="62" y="168" font-size="66" font-weight="700" letter-spacing="-1.5" fill="url(#name)">Dawood Akbar</text>
<text x="64" y="214" font-size="22" fill="#d3d9ef">I build iOS apps that ship, and keep them fast after they do.</text>
<rect x="64" y="262" width="66" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#27315a"/><text x="97.0" y="280.7" font-size="13" fill="#d3d9ef" text-anchor="middle">Swift</text><rect x="138" y="262" width="66" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#27315a"/><text x="171.0" y="280.7" font-size="13" fill="#d3d9ef" text-anchor="middle">UIKit</text><rect x="212" y="262" width="82" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#27315a"/><text x="253.0" y="280.7" font-size="13" fill="#d3d9ef" text-anchor="middle">SwiftUI</text><rect x="302" y="262" width="98" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#27315a"/><text x="351.0" y="280.7" font-size="13" fill="#d3d9ef" text-anchor="middle">Core Data</text><rect x="408" y="262" width="130" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#27315a"/><text x="473.0" y="280.7" font-size="13" fill="#d3d9ef" text-anchor="middle">CoreBluetooth</text><rect x="546" y="262" width="106" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#27315a"/><text x="599.0" y="280.7" font-size="13" fill="#d3d9ef" text-anchor="middle">StoreKit 2</text><rect x="660" y="262" width="82" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#27315a"/><text x="701.0" y="280.7" font-size="13" fill="#d3d9ef" text-anchor="middle">Combine</text>
<g class="phone">
  <rect x="924" y="42" width="212" height="360" rx="40" fill="#070b17" stroke="#3a4672" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="934" y="52" width="192" height="320" fill="#0d1430"/>
    <g class="banner">
      <rect x="944" y="88" width="172" height="52" rx="14" fill="#1b2550" stroke="#33407a"/>
      <rect x="954" y="102" width="24" height="24" rx="7" fill="#2bb6a3"/>
      <text x="986" y="111" font-size="10.5" font-weight="700" fill="#f1f4fd">Fikar</text>
      <text x="1104" y="111" font-size="9" fill="#8f99bb" text-anchor="end">now</text>
      <text x="986" y="127" font-size="10" fill="#d3d9ef">Appointment confirmed</text>
    </g>
    <text x="948" y="178" class="mono" font-size="9.5" letter-spacing="1.5" fill="#8f99bb">LIVE WORKOUT</text>
    <path d="M934 214 H980 L988 200 L996 230 L1004 184 L1012 222 L1018 214 H1046 L1054 204 L1062 226 L1068 214 H1126" fill="none" stroke="#2a3560" stroke-width="2"/>
    <path class="ecg" d="M934 214 H980 L988 200 L996 230 L1004 184 L1012 222 L1018 214 H1046 L1054 204 L1062 226 L1068 214 H1126" fill="none" stroke="#ff6b6b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="948" y="268" font-size="30" font-weight="700" fill="#f1f4fd">142<tspan font-size="13" font-weight="500" fill="#8f99bb"> bpm</tspan></text>
    <rect x="948" y="280" width="62" height="18" rx="9" fill="#ff6b6b" fill-opacity="0.18"/>
    <text x="979" y="293" font-size="10" font-weight="600" fill="#ff8a8a" text-anchor="middle">Zone 4</text>
    <rect class="skel" x="948" y="314" width="164" height="12" rx="6" fill="#ffffff" fill-opacity="0.07"/>
    <rect class="skel b" x="948" y="334" width="120" height="12" rx="6" fill="#ffffff" fill-opacity="0.07"/>
    <rect class="skel c" x="948" y="354" width="142" height="12" rx="6" fill="#ffffff" fill-opacity="0.07"/>
  </g>
  <rect x="1000" y="60" width="60" height="18" rx="9" fill="#000"/>
</g>

</g>
<rect x="0.5" y="0.5" width="1199" height="339" rx="22" fill="none" stroke="#27315a"/>
</svg>
