<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="FitTracker: Clean Architecture layers">
<title>FitTracker: Clean Architecture layers</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#131c38"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
<clipPath id="round"><rect width="1200" height="420" rx="22"/></clipPath>
<radialGradient id="g" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff6b6b" stop-opacity="0.22"/><stop offset="1" stop-color="#ff6b6b" stop-opacity="0"/></radialGradient>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }

.flow { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -28; } }
.core { animation: core 3s ease-in-out infinite; }
@keyframes core { 0%,100% { stroke-opacity: .55; } 50% { stroke-opacity: 1; } }
.ecg { stroke-dasharray: 380; animation: ecg 2.6s linear infinite; }
@keyframes ecg { from { stroke-dashoffset: 760; } to { stroke-dashoffset: 0; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#round)">
<rect width="1200" height="420" fill="url(#bg)"/>
<rect width="1200" height="420" fill="url(#grid)"/>
<circle cx="160" cy="80" r="240" fill="url(#g)"/><text x="48" y="70" class="mono" font-size="13" letter-spacing="2.5" fill="#ff8a8a">IN PROGRESS  ·  PERSONAL PROJECT</text><text x="46" y="122" font-size="44" font-weight="700" letter-spacing="-1" fill="#f1f4fd">FitTracker</text><text x="48" y="160" font-size="16.5" fill="#d3d9ef">Offline-first workout tracker that records heart rate</text><text x="48" y="185" font-size="16.5" fill="#d3d9ef">from a Bluetooth sensor and reports time in each zone.</text><text x="48" y="210" font-size="16.5" fill="#d3d9ef">Built test-first.</text><text x="48" y="284" font-size="34" font-weight="700" fill="#f1f4fd">10</text><text x="48" y="308" font-size="13.5" fill="#8f99bb">Swift Package modules</text><text x="218" y="284" font-size="34" font-weight="700" fill="#f1f4fd">97</text><text x="218" y="308" font-size="13.5" fill="#8f99bb">tests, Swift Testing</text><text x="388" y="284" font-size="34" font-weight="700" fill="#f1f4fd">6</text><text x="388" y="308" font-size="13.5" fill="#8f99bb">Swift language mode</text><path d="M48 360 H190 L200 344 L210 378 L220 330 L230 370 L238 360 H330 L340 350 L350 372 L358 360 H560" fill="none" stroke="#2a3560" stroke-width="2"/><path class="ecg" d="M48 360 H190 L200 344 L210 378 L220 330 L230 370 L238 360 H330 L340 350 L350 372 L358 360 H560" fill="none" stroke="#ff6b6b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="690" y="38" width="450" height="56" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#27315a" stroke-width="1"/><text x="712" y="63" font-size="16" font-weight="700" fill="#f1f4fd">App</text><text x="712" y="82" class="mono" font-size="12" fill="#8f99bb">composition root wires every object</text><rect x="690" y="108" width="450" height="56" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#27315a" stroke-width="1"/><text x="712" y="133" font-size="16" font-weight="700" fill="#f1f4fd">Features</text><text x="712" y="152" class="mono" font-size="12" fill="#8f99bb">SwiftUI views and @Observable view models</text><rect class="core" x="690" y="178" width="450" height="56" rx="12" fill="#1a2a5e" fill-opacity="1" stroke="#5b9dff" stroke-width="2"/><text x="712" y="203" font-size="16" font-weight="700" fill="#a9c8ff">Domain</text><text x="712" y="222" class="mono" font-size="12" fill="#8f99bb">entities, use cases, repository protocols</text><rect x="690" y="248" width="450" height="56" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#27315a" stroke-width="1"/><text x="712" y="273" font-size="16" font-weight="700" fill="#f1f4fd">Repositories</text><text x="712" y="292" class="mono" font-size="12" fill="#8f99bb">implementations and mapping</text><rect x="690" y="318" width="450" height="56" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#27315a" stroke-width="1"/><text x="712" y="343" font-size="16" font-weight="700" fill="#f1f4fd">Infrastructure</text><text x="712" y="362" class="mono" font-size="12" fill="#8f99bb">Core Data  ·  CoreBluetooth  ·  networking</text><path class="flow" d="M664 66.0 V194.0" stroke="#5b9dff" stroke-width="2" fill="none"/><line x1="664" y1="66.0" x2="690" y2="66.0" stroke="#27315a"/><path class="flow" d="M664 136.0 V194.0" stroke="#5b9dff" stroke-width="2" fill="none"/><line x1="664" y1="136.0" x2="690" y2="136.0" stroke="#27315a"/><path class="flow" d="M664 276.0 V218.0" stroke="#5b9dff" stroke-width="2" fill="none"/><line x1="664" y1="276.0" x2="690" y2="276.0" stroke="#27315a"/><path class="flow" d="M664 346.0 V218.0" stroke="#5b9dff" stroke-width="2" fill="none"/><line x1="664" y1="346.0" x2="690" y2="346.0" stroke="#27315a"/><path d="M658 186.0 L664 196.0 L670 186.0" fill="none" stroke="#5b9dff" stroke-width="2"/><path d="M658 226.0 L664 216.0 L670 226.0" fill="none" stroke="#5b9dff" stroke-width="2"/><text x="690" y="402" class="mono" font-size="12.5" fill="#8f99bb">Dependencies point inward, toward Domain.</text>
</g>
<rect x="0.5" y="0.5" width="1199" height="419" rx="22" fill="none" stroke="#27315a"/>
</svg>
