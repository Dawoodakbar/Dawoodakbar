<rect x="0" y="0" width="1200" height="52" fill="#ffffff" fill-opacity="0.03"/><rect x="0" y="52" width="1200" height="1" fill="#27315a"/><circle cx="30" cy="26" r="6.5" fill="#ff5f57"/><circle cx="52" cy="26" r="6.5" fill="#febc2e"/><circle cx="74" cy="26" r="6.5" fill="#28c840"/><text x="600" y="31" class="mono" font-size="13" fill="#8f99bb" text-anchor="middle">fikar-ios  —  zsh</text><text x="32" y="82" class="mono" font-size="14.5" fill="#34d399">~/fikar-ios <tspan fill="#f1f4fd">git log --oneline --author=dawood</tspan></text><rect class="scan" x="16" y="98" width="1168" height="30" rx="6" fill="#5b9dff" fill-opacity="0.09"/><text x="32" y="118" class="mono" font-size="14.5" fill="#e5c07b">1312f75</text><text x="118" y="118" class="mono" font-size="14.5" fill="#ffb454">fix:</text><text x="162" y="118" class="mono" font-size="14.5" fill="#d3d9ef">close re-entrancy window and retain cycle in voice upload</text><text x="32" y="148" class="mono" font-size="14.5" fill="#e5c07b">d148728</text><text x="118" y="148" class="mono" font-size="14.5" fill="#ffb454">fix:</text><text x="162" y="148" class="mono" font-size="14.5" fill="#d3d9ef">eliminate data race in VotingService&#x27;s shared vote state</text><text x="32" y="178" class="mono" font-size="14.5" fill="#e5c07b">e35d002</text><text x="118" y="178" class="mono" font-size="14.5" fill="#ffb454">fix:</text><text x="162" y="178" class="mono" font-size="14.5" fill="#d3d9ef">release AVPlayer time observer and NotificationCenter token on deinit</text><text x="32" y="208" class="mono" font-size="14.5" fill="#e5c07b">01cb3ea</text><text x="118" y="208" class="mono" font-size="14.5" fill="#ffb454">fix:</text><text x="162" y="208" class="mono" font-size="14.5" fill="#d3d9ef">remove dead Realtime Database observers that leak on every call</text><text x="32" y="238" class="mono" font-size="14.5" fill="#e5c07b">4202065</text><text x="118" y="238" class="mono" font-size="14.5" fill="#ffb454">fix:</text><text x="162" y="238" class="mono" font-size="14.5" fill="#d3d9ef">replace per-row live Firestore listener with a one-time fetch</text><text x="32" y="268" class="mono" font-size="14.5" fill="#e5c07b">5375850</text><text x="118" y="268" class="mono" font-size="14.5" fill="#ffb454">fix:</text><text x="162" y="268" class="mono" font-size="14.5" fill="#d3d9ef">stop notification pagination from racing a concurrent retry</text><text x="32" y="298" class="mono" font-size="14.5" fill="#e5c07b">16766c7</text><text x="118" y="298" class="mono" font-size="14.5" fill="#5b9dff">refactor:</text><text x="206" y="298" class="mono" font-size="14.5" fill="#d3d9ef">unify QuestionedToMeVM/MyPrivateQuestionsVM pagination into a shared base class</text><text x="32" y="328" class="mono" font-size="14.5" fill="#e5c07b">5721752</text><text x="118" y="328" class="mono" font-size="14.5" fill="#5b9dff">refactor:</text><text x="206" y="328" class="mono" font-size="14.5" fill="#d3d9ef">extract AppEmptyState, replacing 4 duplicated empty-state blocks</text><text x="32" y="358" class="mono" font-size="14.5" fill="#e5c07b">238ea96</text><text x="118" y="358" class="mono" font-size="14.5" fill="#c3e88d">feat:</text><text x="171" y="358" class="mono" font-size="14.5" fill="#d3d9ef">deep-link appointment notifications to that appointment&#x27;s detail</text><text x="32" y="388" class="mono" font-size="14.5" fill="#e5c07b">ee1428d</text><text x="118" y="388" class="mono" font-size="14.5" fill="#c3e88d">feat:</text><text x="171" y="388" class="mono" font-size="14.5" fill="#d3d9ef">add persistent caching and resilient loading</text><text x="32" y="418" class="mono" font-size="14.5" fill="#e5c07b">c26f52a</text><text x="118" y="418" class="mono" font-size="14.5" fill="#34d399">test:</text><text x="171" y="418" class="mono" font-size="14.5" fill="#d3d9ef">add end-to-end UI coverage for key flows</text><text x="32" y="456" class="mono" font-size="14.5" fill="#34d399">~/fikar-ios</text><rect class="blink" x="138" y="442" width="9" height="18" fill="#f1f4fd"/>
