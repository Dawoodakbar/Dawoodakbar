<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="5 apps live, 7 client apps, 4 languages, 97 tests">
<title>5 apps live, 7 client apps, 4 languages, 97 tests</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#131c38"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
<clipPath id="round"><rect width="1200" height="140" rx="22"/></clipPath>
<linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#5b9dff" stop-opacity="0"/><stop offset="0.5" stop-color="#5b9dff" stop-opacity="0.9"/><stop offset="1" stop-color="#5b9dff" stop-opacity="0"/></linearGradient>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }

.sweep { animation: sweep 5s ease-in-out infinite; }
@keyframes sweep { 0% { transform: translateX(-300px); } 60%,100% { transform: translateX(1200px); } }
.ring { animation: ring 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ring { 0% { transform: scale(.6); opacity: .7; } 100% { transform: scale(2.6); opacity: 0; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#round)">
<rect width="1200" height="140" fill="url(#bg)"/>
<rect width="1200" height="140" fill="url(#grid)"/>
<rect class="sweep" x="0" y="0" width="300" height="2" fill="url(#sw)"/><text x="40" y="80" font-size="50" font-weight="700" letter-spacing="-1" fill="#f1f4fd">5</text><text x="40" y="108" font-size="15" fill="#8f99bb">apps live on the App Store</text><circle class="ring" cx="92" cy="48" r="6" fill="#34d399"/><circle cx="92" cy="48" r="6" fill="#34d399"/><line x1="300" y1="28" x2="300" y2="112" stroke="#27315a"/><text x="340" y="80" font-size="50" font-weight="700" letter-spacing="-1" fill="#f1f4fd">7</text><text x="340" y="108" font-size="15" fill="#8f99bb">client apps worked on</text><line x1="600" y1="28" x2="600" y2="112" stroke="#27315a"/><text x="640" y="80" font-size="50" font-weight="700" letter-spacing="-1" fill="#f1f4fd">4</text><text x="640" y="108" font-size="15" fill="#8f99bb">languages shipped, incl. right-to-left</text><line x1="900" y1="28" x2="900" y2="112" stroke="#27315a"/><text x="940" y="80" font-size="50" font-weight="700" letter-spacing="-1" fill="#f1f4fd">97</text><text x="940" y="108" font-size="15" fill="#8f99bb">tests in FitTracker</text>
</g>
<rect x="0.5" y="0.5" width="1199" height="139" rx="22" fill="none" stroke="#27315a"/>
</svg>
