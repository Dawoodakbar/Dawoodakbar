<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-label="True Drop: Sobriety and recovery app  ·  MLBench">
<title>True Drop: Sobriety and recovery app  ·  MLBench</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#131c38"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
<clipPath id="round"><rect width="600" height="340" rx="22"/></clipPath>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f5a524" stop-opacity="0.38"/><stop offset="1" stop-color="#f5a524" stop-opacity="0"/></radialGradient>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }

.breathe { animation: breathe 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
.ring { animation: ring 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ring { 0% { transform: scale(.6); opacity: .7; } 100% { transform: scale(2.8); opacity: 0; } }
.bar { animation: bar 4s ease-in-out infinite; transform-box: fill-box; transform-origin: left; }
@keyframes bar { 0%,100% { transform: scaleX(.35); } 50% { transform: scaleX(1); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#round)">
<rect width="600" height="340" fill="url(#bg)"/>
<rect width="600" height="340" fill="url(#grid)"/>
<circle class="breathe" cx="560" cy="20" r="200" fill="url(#glow)"/><rect x="32" y="32" width="52" height="52" rx="14" fill="#f5a524"/><text x="58" y="67" font-size="26" font-weight="700" fill="#0a0f1f" text-anchor="middle">T</text><text x="100" y="58" font-size="26" font-weight="700" fill="#f1f4fd">True Drop</text><text x="100" y="80" font-size="14" fill="#8f99bb">Sobriety and recovery app  ·  MLBench</text><rect x="420" y="38" width="148" height="28" rx="14" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/><circle class="ring" cx="438" cy="52" r="4.5" fill="#34d399"/><circle cx="438" cy="52" r="4.5" fill="#34d399"/><text x="450" y="56.5" font-size="12.5" font-weight="600" fill="#34d399">Live on App Store</text><rect x="32" y="104" width="536" height="1" fill="#27315a"/><rect class="bar" x="32" y="104" width="160" height="2" fill="#f5a524"/><text x="32" y="134" class="mono" font-size="11.5" letter-spacing="1.6" fill="#f5a524">SUBSCRIPTIONS  ·  DAILY ENGAGEMENT</text><circle cx="38" cy="159" r="3" fill="#f5a524"/><text x="52" y="164" font-size="14.5" fill="#d3d9ef">Monthly and yearly subscriptions with StoreKit 2 and verified transactions</text><circle cx="38" cy="186" r="3" fill="#f5a524"/><text x="52" y="191" font-size="14.5" fill="#d3d9ef">Entitlements synced with the back end at launch, login and account changes</text><circle cx="38" cy="213" r="3" fill="#f5a524"/><text x="52" y="218" font-size="14.5" fill="#d3d9ef">Daily check-ins, streaks with skipped-day handling, animated milestones</text><rect x="32" y="290" width="80" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#27315a"/><text x="72.0" y="307.5" font-size="12.5" fill="#d3d9ef" text-anchor="middle">SwiftUI</text><rect x="120" y="290" width="103" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#27315a"/><text x="171.5" y="307.5" font-size="12.5" fill="#d3d9ef" text-anchor="middle">StoreKit 2</text><rect x="231" y="290" width="80" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#27315a"/><text x="271.0" y="307.5" font-size="12.5" fill="#d3d9ef" text-anchor="middle">Combine</text><rect x="319" y="290" width="103" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#27315a"/><text x="370.5" y="307.5" font-size="12.5" fill="#d3d9ef" text-anchor="middle">URLSession</text><rect x="430" y="290" width="95" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#27315a"/><text x="477.5" y="307.5" font-size="12.5" fill="#d3d9ef" text-anchor="middle">SwiftLint</text>
</g>
<rect x="0.5" y="0.5" width="599" height="339" rx="22" fill="none" stroke="#27315a"/>
</svg>
